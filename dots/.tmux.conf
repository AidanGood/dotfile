# change window
bind-key -n C-right   next-window
bind-key -n C-left    previous-window

# change pane
bind-key -n S-right   select-pane -R
bind-key -n S-left    select-pane -L
bind-key -n S-down    select-pane -D
bind-key -n S-up      select-pane -U
bind-key    r         source-file ~/.tmux.conf

# quick layout-change rebinds
bind-key    o         new-window \; split-window \; split-window -h \; select-pane -U \; split-window -h
bind-key    n         new-window

# rebinds for pane splitting
bind-key    \\        split-window -h -c "#{pane_current_path}"
unbind      %
bind-key    -         split-window -v -c "#{pane_current_path}"
unbind      \"

# pane resizing rebinds that allow repeats of the arrow keys
bind-key -r Up        resize-pane -U
bind-key -r Down      resize-pane -D
bind-key -r Left      resize-pane -L
bind-key -r Right     resize-pane -R

# rebinds for moving windows around
bind-key -n C-s-Left  swap-window -t -1 -d
bind-key -n C-s-Right swap-window -t +1 -d

# Toggle mouse on/off with prefix m
bind-key    m         set -F -g mouse "#{?mouse,0,1}" \; display 'mouse mode #{?mouse,on,off}"

# remap prefix
set -g prefix 'C-Space'
unbind C-b
bind 'C-Space' send-prefix

# use default time to wait after escape to determine if it is part of function or meta sequence
set -s escape-time 0
# Recommended by neovim :checkhealth; allows the terminal to set focus events to apps running tmux
set -g focus-events on

# trying to set reasonable formats for escape sequences
set -g default-terminal "screen-256color"
set -ga terminal-overrides ',*-256color*:TC'
set -as terminal-overrides ",xterm*:RGB"

# increase page scrollback
set-option -g history-limit 5000

# use vi-like navigation
setw -g mode-keys vi

# UI mods
set -g pane-active-boarder-style "bg=red fg=red"

set -g status-right-length 0
set -g status-right ""
set -g window-status-format '#[fg=black]#{window_name}'
set -g window-status-current-style "fg=white bg=blue"
set -g renumber-windows on
set -g mouse on

# fix terminal corruption due to clipboard updates using Mate over citrix. But less reliable using kitty/putty over ssh
set-hook -g pane-set-clipboard refresh-client

# display cwd on the right of status bar
#set-option -g status-right '#{pane_current_path}'
#set-option -g status-interval 1

# prefix + z zooms the current pane. prefix + ctrl + z will close the session
# Unbind the closing hotfix to avoid
#unbind ^z

